name: Symfony Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "back-api/**"
      - ".github/workflows/back-deploy.yml"

  pull_request:
    branches:
      - main
    paths:
      - "back-api/**"
      - ".github/workflows/back-deploy.yml"

permissions:
  contents: read

jobs:
  symfony-tests:
    name: Symfony PHPUnit Tests

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4

        env:
          MYSQL_DATABASE: cinespin_test
          MYSQL_USER: app
          MYSQL_PASSWORD: app
          MYSQL_ROOT_PASSWORD: root

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      APP_DEBUG: 0
      DATABASE_URL: "mysql://app:app@127.0.0.1:3306/cinespin_test?serverVersion=8.4&charset=utf8mb4"

    defaults:
      run:
        working-directory: back-api

    steps:
      # 1. Récupération du projet
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installation de PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, intl, zip
          coverage: none
          tools: composer:v2

      # 3. Cache Composer
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('back-api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      # 4. Installation des dépendances
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # 5. Vérification de Symfony
      - name: Check Symfony console
        run: php bin/console about

      # 6. Création du schéma de BDD pour les tests
      - name: Create test database schema
        run: php bin/console doctrine:schema:create --env=test

      # 7. Lancement des tests
      - name: Run PHPUnit tests
        run: php bin/phpunit