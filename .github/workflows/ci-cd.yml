name: CineSpin CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false


jobs:

  # =====================================================
  # FRONTEND
  # =====================================================

  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front-cine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front-cine/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: front-cine/dist


  # =====================================================
  # BACKEND
  # =====================================================

  backend:
    name: Symfony PHPUnit Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4

        env:
          MYSQL_DATABASE: cinespin_test
          MYSQL_USER: app
          MYSQL_PASSWORD: app
          MYSQL_ROOT_PASSWORD: root

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      APP_DEBUG: 0

      DATABASE_URL: >-
        mysql://app:app@127.0.0.1:3306/cinespin?serverVersion=8.4&charset=utf8mb4

    defaults:
      run:
        working-directory: back-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, intl, zip, mbstring, dom, xml, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('back-api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check Symfony test environment
        run: php bin/console about --env=test

      - name: Create test database schema
        run: php bin/console doctrine:schema:create --env=test

      - name: Run PHPUnit
        run: php bin/phpunit


  # =====================================================
  # DEPLOY FRONTEND
  # =====================================================

  deploy-frontend:
    name: Deploy Frontend Production

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - frontend
      - backend

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5